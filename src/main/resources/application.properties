spring.application.name=citas-api

# Conexión a la Base de Datos mediante variables de entorno (con fallback a PostgreSQL local)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/citas_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Puerto del servidor (Render inyecta PORT automáticamente)
server.port=${PORT:8080}

# Configuración de JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Configuración de OpenAPI (SpringDoc)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Configuración de Scalar API Reference
scalar.enabled=true
scalar.url=/v3/api-docs
scalar.path=/scalar